<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 測速偵測 - 高階模式 (修復版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00aaff; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; }
        #status { position: fixed; top: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--primary); z-index: 1000; color: var(--primary); font-weight: bold; }
        .view-container { position: relative; width: 100vw; height: 100vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        #controls { position: fixed; bottom: 30px; background: rgba(20,20,25,0.9); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; z-index: 100; text-align: center; }
        select, button, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; }
        #startBtn { background: var(--primary); color: black; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div id="status">系統就緒</div>
    
    <div class="view-container">
        <video id="webcam" playsinline muted autoplay></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <div style="font-size: 12px; color: #888; margin-bottom: 10px;">高階 API - 自動解碼 19125 候選框</div>
        <input type="file" id="modelUpload" accept=".tflite">
        <select id="cameraSelect"><option value="">正在載入鏡頭...</option></select>
        <button id="startBtn" onclick="startApp()">啟動高階偵測系統</button>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.mjs";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const cameraSelect = document.getElementById('cameraSelect');
        const modelUpload = document.getElementById('modelUpload');
        
        let detector = null;
        const classMap = {
            1: "危險路段小心行駛", 2: "災害路段注意路段", 3: "12噸以上貨車禁止左轉", 4: "事故路段小心行駛", 5: "分道",
            6: "前方施工", 7: "前方有測照相", 8: "前方有測照相限速50", 9: "前方有測速照相", 10: "前方有測速照相限速50",
            11: "前方測速照相", 12: "前方測速照相限速50", 13: "前方禁止左轉", 14: "前有測速照相限速50", 15: "前有科技執法加強違規取締",
            16: "危險", 17: "危險路段小心行駛", 18: "右側車道縮減", 19: "右側道路縮減", 20: "小心落石",
            21: "小心行人", 22: "岔路", 23: "左彎", 24: "彎路", 25: "校區",
            26: "注意落石", 27: "當心兒童", 28: "當心行人", 29: "禁止15噸以上大貨車右轉", 30: "禁止15頓以上大貨車右轉",
            31: "禁止右轉", 32: "禁止左轉", 33: "禁止汽車右轉", 34: "禁止貨出左轉", 35: "禁止貨車右轉",
            36: "禁止貨車左右行駛", 37: "禁止貨車左右轉", 38: "禁止貨車左轉", 39: "禁止迴轉", 40: "背景",
            41: "貨車禁止右轉", 42: "貨車禁止左右轉", 43: "連續右彎", 44: "連續彎路", 45: "連續彎路先向右",
            46: "連續彎路先向左", 47: "連續轉彎先向右", 48: "連續轉彎先向左", 49: "連續轉彎向左", 50: "道路施工",
            51: "道路縮減", 52: "限速50", 53: "險降坡"
        };

        // 初始化相機
        async function initCameras() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            cameraSelect.innerHTML = videoDevices.map(d => `<option value="${d.deviceId}">${d.label || '鏡頭 ' + (cameraSelect.length+1)}</option>`).join('');
        }
        initCameras();

        window.startApp = async function() {
            document.getElementById('startBtn').style.display = 'none';
            statusEl.innerText = "正在載入高階引擎...";
            
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                let modelSource = modelUpload.files[0] ? URL.createObjectURL(modelUpload.files[0]) : './model.tflite';
                
                detector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: modelSource, delegate: "CPU" },
                    scoreThreshold: 0.1, // 門檻設低一點
                    runningMode: "VIDEO"
                });

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: cameraSelect.value ? { exact: cameraSelect.value } : undefined, facingMode: 'environment' } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    statusEl.innerText = "偵測運行中 (19125模式)";
                    predictLoop();
                };
            } catch (e) {
                statusEl.innerText = "載入失敗: " + e.message;
                console.error(e);
            }
        }

        async function predictLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && detector) {
                const startTimeMs = performance.now();
                const detections = detector.detectForVideo(video, startTimeMs);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let detection of detections.detections) {
                    const { originX, originY, width, height } = detection.boundingBox;
                    const category = detection.categories[0];
                    
                    // 繪製框框
                    ctx.strokeStyle = "#00aaff"; ctx.lineWidth = 4;
                    ctx.strokeRect(originX, originY, width, height);
                    
                    // 智慧標籤判定邏輯
                    let labelName = "偵測目標";
                    const raw = category.categoryName || "";

                    if (category.index >= 0 && classMap[category.index]) {
                        labelName = classMap[category.index];
                    } else if (raw.includes("50")) {
                        labelName = "前方有測速照相限速50";
                    } else if (raw.includes("賀") || raw.includes("t") || raw.includes("Э")) {
                        labelName = "前方有測速照相";
                    }

                    // 繪製標籤 (只顯示乾淨的中文與百分比)
                    ctx.fillStyle = "#00aaff"; ctx.font = "bold 20px Inter, 'Microsoft JhengHei', sans-serif";
                    ctx.fillText(`${labelName} ${(category.score * 100).toFixed(0)}%`, originX, originY - 10);
                }
            }
            requestAnimationFrame(predictLoop);
        }
    </script>
</body>
</html>
