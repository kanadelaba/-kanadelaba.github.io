<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 測速偵測 - 高階模式 (修復版)</title>
    <script>
        // 修復：攔截 TextDecoder 錯誤，防止掃到東西時因為模型內部中文編碼問題導致整個程式崩潰卡死
        (function () {
            const OriginalTextDecoder = window.TextDecoder;
            if (!OriginalTextDecoder) return;

            const originalDecode = OriginalTextDecoder.prototype.decode;
            OriginalTextDecoder.prototype.decode = function (input, options) {
                try {
                    return originalDecode.call(this, input, options);
                } catch (err) {
                    try {
                        const big5Decoder = new OriginalTextDecoder('big5');
                        return originalDecode.call(big5Decoder, input);
                    } catch (fallbackErr) {
                        try {
                            const lenientDecoder = new OriginalTextDecoder('utf-8', { fatal: false });
                            return originalDecode.call(lenientDecoder, input);
                        } catch (e) {
                            return "偵測目標";
                        }
                    }
                }
            };
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00aaff; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; }
        #status { position: fixed; top: 20px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--primary); z-index: 1000; color: var(--primary); font-weight: bold; }
        .view-container { position: relative; width: 100vw; height: 100vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        #controls { position: fixed; bottom: 30px; background: rgba(20,20,25,0.9); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; z-index: 100; text-align: center; }
        select, button, input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: none; background: rgba(255,255,255,0.1); color: white; cursor: pointer; }
        #startBtn { background: var(--primary); color: black; font-weight: bold; font-size: 16px; }

        /* 日誌視窗樣式 */
        #logContainer {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 320px;
            max-height: 300px;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 170, 255, 0.4);
            border-radius: 12px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', 'Courier New', monospace;
        }

        #logContainer.collapsed {
            max-height: 40px;
            width: 180px;
        }

        #logHeader {
            padding: 10px 14px;
            background: rgba(0, 170, 255, 0.15);
            border-bottom: 1px solid rgba(0, 170, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: #e0e0e0;
            cursor: pointer;
            user-select: none;
        }

        #logControls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #logStatusIndicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .status-running { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .status-warn { background: #ffaa00; box-shadow: 0 0 8px #ffaa00; }
        .status-error { background: #ff3333; box-shadow: 0 0 8px #ff3333; }

        .log-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ccc;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
            margin: 0;
        }

        .log-btn:hover { background: rgba(0, 170, 255, 0.3); color: white; }

        #logContent {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 11px;
            color: #a0d8ff;
            line-height: 1.4;
            max-height: 260px;
        }

        .log-item {
            margin-bottom: 6px;
            word-break: break-all;
            border-left: 2px solid rgba(0, 170, 255, 0.3);
            padding-left: 6px;
        }
        .log-item.info { border-color: #00aaff; color: #bde0ff; }
        .log-item.warn { border-color: #ffaa00; color: #ffe6b3; }
        .log-item.error { border-color: #ff3333; color: #ffcccc; font-weight: bold; }

        #cleanModeBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 1001;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            width: auto;
            margin: 0;
            display: none; /* 最初隱藏，啟動後顯示 */
        }
        #cleanModeBtn:hover {
            background: var(--primary);
            color: black;
        }

        .clean-mode #status,
        .clean-mode #logContainer,
        .clean-mode #controls {
            display: none !important;
        }
    </style>
</head>
<body>
    <button id="cleanModeBtn" onclick="toggleCleanMode()">👁️ 隱藏介面</button>
    <div id="status">系統就緒</div>
    
    <!-- 浮動日誌視窗 -->
    <div id="logContainer">
        <div id="logHeader" onclick="toggleLogPanel()">
            <span>系統日誌</span>
            <div id="logControls">
                <span id="logStatusIndicator" class="status-warn"></span>
                <button class="log-btn" id="toggleLogBtn" onclick="event.stopPropagation(); toggleLogPanel();">收合</button>
                <button class="log-btn" onclick="event.stopPropagation(); clearLogs();">清除</button>
            </div>
        </div>
        <div id="logContent"></div>
    </div>

    <div class="view-container">
        <video id="webcam" playsinline muted autoplay></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="controls">
        <div style="font-size: 12px; color: #888; margin-bottom: 10px;">高階 API - 自動解碼 19125 候選框</div>
        <input type="file" id="modelUpload" accept=".tflite">
        <select id="cameraSelect"><option value="">正在載入鏡頭...</option></select>
        <select id="delegateSelect" onchange="if(window.isAppRunning) restartWithDelegate(this.value)">
            <option value="AUTO">運算模式: 自動切換 (推薦)</option>
            <option value="GPU">運算模式: 強制 GPU</option>
            <option value="CPU">運算模式: 強制 CPU</option>
        </select>
        <button id="startBtn" onclick="startApp()">啟動高階偵測系統</button>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const cameraSelect = document.getElementById('cameraSelect');
        const modelUpload = document.getElementById('modelUpload');
        
        const logContent = document.getElementById('logContent');
        const statusIndicator = document.getElementById('logStatusIndicator');
        
        let detector = null;
        let vision = null;
        let lastVideoTime = -1;
        let isProcessing = false;
        let crashCount = 0;
        let isRestartingDetector = false;
        let delegateMode = "AUTO";
        let fallbackToCPU = false;
        window.isAppRunning = false;
        const defaultModelSource = './model.tflite';

        // 日誌處理函式
        window.addLog = function (message, type = 'info') {
            const panel = document.getElementById('logContainer');
            if (type === 'info' && panel && panel.classList.contains('collapsed')) {
                return; // 收合時不處理 info 級別日誌，節省 DOM 渲染資源
            }
            const timestamp = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.innerText = `[${timestamp}] ${message}`;
            logContent.appendChild(item);
            logContent.scrollTop = logContent.scrollHeight;
            if (logContent.children.length > 50) {
                logContent.removeChild(logContent.firstChild);
            }
        }

        window.toggleLogPanel = function () {
            const panel = document.getElementById('logContainer');
            const btn = document.getElementById('toggleLogBtn');
            panel.classList.toggle('collapsed');
            btn.innerText = panel.classList.contains('collapsed') ? '展開' : '收合';
        }

        window.clearLogs = function () {
            logContent.innerHTML = '';
        }

        window.restartWithDelegate = async function(mode) {
            delegateMode = mode;
            fallbackToCPU = false;
            if (detector) {
                window.addLog(`手動切換運算模式至 ${mode}，正在重啟引擎...`, "info");
                isRestartingDetector = true;
                try {
                    await setupDetector();
                    crashCount = 0;
                } catch(err) {
                    window.addLog(`切換模式失敗: ` + err.message, "error");
                } finally {
                    isRestartingDetector = false;
                }
            }
        }

        window.toggleCleanMode = function() {
            document.body.classList.toggle('clean-mode');
            const btn = document.getElementById('cleanModeBtn');
            if (document.body.classList.contains('clean-mode')) {
                btn.innerText = '👁️ 顯示介面';
                btn.style.opacity = '0.5';
            } else {
                btn.innerText = '👁️ 隱藏介面';
                btn.style.opacity = '1';
            }
        }

        // 精準依據模型 labels.txt 內 Unicode 排序編排的中文對照表 (0-based)
        const modelIndexToChinese = {
            0: "背景", 
            1: "危險路段小心行駛", 
            2: "災害路段注意路段", 
            3: "12噸以上貨車禁止左轉", 
            4: "事故路段小心行駛", 
            5: "分道", 
            6: "前方施工", 
            7: "前方有測速照相", 
            8: "前方有測速照相限速50", 
            9: "前方有測速照相", 
            10: "前方有測速照相限速50", 
            11: "前方測速照相", 
            12: "前方測速照相限速50", 
            13: "前方禁止左轉", 
            14: "前有測速照相限速50", 
            15: "前有科技執法加強違規取締", 
            16: "危險", 
            17: "危險路段小心行駛", 
            18: "右側車道縮減", 
            19: "右側道路縮減", 
            20: "小心落石", 
            21: "小心行人", 
            22: "岔路", 
            23: "左彎", 
            24: "彎路", 
            25: "校區", 
            26: "注意落石", 
            27: "當心兒童", 
            28: "當心行人", 
            29: "禁止15噸以上大貨車右轉", 
            30: "禁止15頓以上大貨車右轉", 
            31: "禁止右轉", 
            32: "禁止左轉", 
            33: "禁止汽車右轉", 
            34: "禁止貨出左轉", 
            35: "禁止貨車右轉", 
            36: "禁止貨車左右行駛", 
            37: "禁止貨車左右轉", 
            38: "禁止貨車左轉", 
            39: "禁止迴轉", 
            40: "背景", 
            41: "貨車禁止右轉", 
            42: "貨車禁止左右轉", 
            43: "連續右彎", 
            44: "連續彎路", 
            45: "連續彎路先向右", 
            46: "連續彎路先向左", 
            47: "連續轉彎先向右", 
            48: "連續轉彎先向左", 
            49: "連續轉彎向左", 
            50: "道路施工", 
            51: "道路縮減", 
            52: "限速50", 
            53: "險降坡"
        };

        // 初始化相機
        async function initCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                cameraSelect.innerHTML = videoDevices.map(d => `<option value="${d.deviceId}">${d.label || '鏡頭 ' + (cameraSelect.length+1)}</option>`).join('');
                window.addLog("相機列表初始化完成");
            } catch(e) {
                window.addLog("無法讀取相機: " + e.message, "error");
            }
        }
        initCameras();

        async function setupDetector() {
            let targetDelegate = "CPU";
            if (delegateMode === "GPU") targetDelegate = "GPU";
            else if (delegateMode === "AUTO") targetDelegate = fallbackToCPU ? "CPU" : "GPU";

            window.addLog(`正在初始化 MediaPipe 偵測引擎 (${targetDelegate} 模式)...`, "info");
            statusIndicator.className = 'status-warn';
            if (detector) {
                try { detector.close(); } catch(e) {}
                detector = null;
            }
            if (!vision) {
                // 使用最新穩定版
                vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm");
            }
            let modelSource = modelUpload.files[0] ? URL.createObjectURL(modelUpload.files[0]) : defaultModelSource;
            
            try {
                detector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: modelSource, delegate: targetDelegate },
                    scoreThreshold: 0.1,
                    runningMode: "VIDEO"
                });
                window.addLog("偵測引擎載入成功！", "info");
                statusIndicator.className = 'status-running';
                if (targetDelegate === "GPU" && delegateMode === "AUTO") {
                    fallbackToCPU = false;
                }
            } catch (error) {
                if (delegateMode === "AUTO" && !fallbackToCPU) {
                    window.addLog("AUTO: GPU 模式初始化失敗，自動降級至 CPU 模式...", "warn");
                    fallbackToCPU = true;
                    await setupDetector(); // 遞迴使用 CPU 模式重試
                } else {
                    throw error;
                }
            }
        }

        window.startApp = async function() {
            window.isAppRunning = true;
            delegateMode = document.getElementById('delegateSelect').value;
            fallbackToCPU = false;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('cleanModeBtn').style.display = 'block';
            statusEl.innerText = "正在載入高階引擎...";
            
            try {
                await setupDetector();
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: cameraSelect.value ? { exact: cameraSelect.value } : undefined, facingMode: 'environment' } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    statusEl.innerText = "偵測運行中 (19125模式)";
                    predictLoop();
                };
            } catch (e) {
                statusEl.innerText = "載入失敗: " + e.message;
                window.addLog("啟動失敗: " + e.message, "error");
                document.getElementById('startBtn').style.display = 'block';
            }
        }

        async function predictLoop() {
            if (isRestartingDetector) {
                requestAnimationFrame(predictLoop);
                return;
            }

            if (video.readyState === video.HAVE_ENOUGH_DATA && detector) {
                if (video.currentTime !== lastVideoTime && !isProcessing) {
                    lastVideoTime = video.currentTime;
                    isProcessing = true;
                    
                    try {
                        const startTimeMs = performance.now();
                        const detections = detector.detectForVideo(video, startTimeMs);
                        
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        crashCount = 0; // 成功運行則重置
                        
                        if (detections && detections.detections) {
                            for (let detection of detections.detections) {
                                if (!detection.boundingBox || !detection.categories || detection.categories.length === 0) continue;
                                
                                const { originX, originY, width, height } = detection.boundingBox;
                                const category = detection.categories[0];
                                
                                ctx.strokeStyle = "#00aaff"; ctx.lineWidth = 4;
                                ctx.strokeRect(originX, originY, width, height);
                                
                                let labelName = "偵測目標";
                                const raw = category.categoryName || "";
                                const index = category.index;

                                if (index !== undefined && index >= 0 && modelIndexToChinese[index]) {
                                    labelName = modelIndexToChinese[index];
                                } else if (raw.includes("50")) {
                                    labelName = "前方有測速照相限速50";
                                } else if (raw.includes("賀") || raw.includes("t") || raw.includes("Э") || raw.includes("照")) {
                                    labelName = "前方有測速照相";
                                } else if (raw) {
                                    labelName = raw;
                                }

                                const scoreStr = (category.score * 100).toFixed(0);
                                ctx.fillStyle = "#00aaff"; ctx.font = "bold 20px Inter, 'Microsoft JhengHei', sans-serif";
                                ctx.fillText(`${labelName} ${scoreStr}%`, originX, originY - 10);
                                
                                // 為避免日誌瘋狂洗頻，隨機抽樣紀錄或者只記錄信心度高的
                                if (Math.random() < 0.1 || category.score > 0.5) {
                                    window.addLog(`偵測: ${labelName} (${scoreStr}%)`, "info");
                                }
                            }
                        }
                    } catch (e) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        window.addLog("推論異常: " + e.message, "error");
                        crashCount++;
                        
                        if (crashCount >= 3 && !isRestartingDetector) {
                            isRestartingDetector = true;
                            if (delegateMode === "AUTO" && !fallbackToCPU) {
                                window.addLog("AUTO: GPU 模式連續異常，降級至 CPU 模式重啟...", "warn");
                                fallbackToCPU = true;
                            } else {
                                window.addLog("連續異常，自動重啟偵測引擎...", "warn");
                            }
                            statusIndicator.className = 'status-warn';
                            
                            try {
                                await setupDetector();
                                crashCount = 0;
                            } catch(err) {
                                window.addLog("重啟失敗", "error");
                            } finally {
                                isRestartingDetector = false;
                            }
                        }
                    } finally {
                        isProcessing = false;
                    }
                }
            }
            requestAnimationFrame(predictLoop);
        }
    </script>
</body>
</html>
